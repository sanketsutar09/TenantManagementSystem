<div class="p-10 min-h-screen sm:pt-10">
  <!-- Filter Section -->
  <div class="flex flex-col sm:flex-row justify-center items-center mb-8 gap-3">
    <input
      [(ngModel)]="filterEmail"
      (ngModelChange)="onSearchChange()"
      type="text"
      placeholder="🔍 Search by email"
      class="bg-white border border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
             rounded-xl px-4 py-2 w-full sm:w-1/3 transition placeholder-gray-400"
    />
    <input
    [(ngModel)]="fromDate"
    (change)="onSearchChange()"
    type="date"
    class="bg-white border border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
           rounded-xl px-4 py-2 w-full sm:w-44 transition placeholder-gray-400"
    placeholder="From Date"
  />
  <input
    [(ngModel)]="toDate"
    (change)="onSearchChange()"
    type="date"
    class="bg-white border border-gray-300 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500
           rounded-xl px-4 py-2 w-full sm:w-44 transition placeholder-gray-400"
    placeholder="To Date"
  />
    <button
      (click)="onRefresh()"
      class="bg-indigo-600 text-white font-medium px-6 py-2 rounded-xl 
             hover:bg-indigo-700 shadow-md transition flex items-center gap-2"
    >
      🔄 Reset
    </button>

    <button
  (click)="generateReport('Users', 'usersTable', {
    Email: filterEmail || 'All',
    'From Date': fromDate || 'Not specified',
    'To Date': toDate || 'Not specified'
  })"
  class="bg-green-600 text-white font-semibold px-6 py-2 rounded-xl 
         hover:bg-green-700 shadow-lg transition flex items-center gap-2"
>
  📄 Generate Report
</button>

    <button
      (click)="openCreateUserModal()"
      class="bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700"
    >
      ➕ Add User
    </button>
  </div>

  <!-- Users Section -->
  <div class="bg-white rounded-2xl shadow-md p-6 bg-opacity-30">
    <div class="flex items-center justify-between mb-5">
      <h3 class="text-xl font-bold text-indigo-600 tracking-wide">👥 Users</h3>
      <span class="text-base text-black">Total: {{ filteredUsers.length }}</span>
    </div>

    <div class="overflow-hidden border border-gray-200 rounded-xl">
      <table id="usersTable" class="w-full text-sm">
        <thead class="bg-indigo-50 text-gray-700 uppercase text-base tracking-wide">
          <tr>
            <th class="px-4 py-3 text-left">Name</th>
            <th class="px-4 py-3 text-left">Email</th>
            <th class="px-4 py-3 text-left">Registered Date</th>
            <th class="px-4 py-3 text-left">Login Count</th>
          </tr>
        </thead>
        <tbody>
          @for (u of visibleUsers; track $index) {
          <tr
            class="odd:bg-white even:bg-gray-50 hover:bg-indigo-50 transition border-b last:border-0 animate-fadeIn"
          >
            <td class="px-4 py-3 font-medium text-gray-800 text-base">{{ u.name }}</td>
            <td class="px-4 py-3 text-gray-600">{{ u.email }}</td>
            <td class="px-4 py-3 text-gray-600">{{ u.createdAt | date}}</td>
            <td class="px-4 py-3 text-gray-700">
              <span
                class="px-2 py-1 rounded-lg bg-indigo-100 text-indigo-700 text-base font-semibold"
              >
                {{ u.loginCount }}
              </span>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>

    <!-- Show More / Show Less Buttons -->
    <div class="flex justify-center mt-5">
      @if (showMoreVisible) {
      <button
        (click)="showMore()"
        class="bg-indigo-600 text-white px-5 py-2 rounded-xl hover:bg-indigo-700 transition-all duration-300 transform hover:scale-105 shadow-md"
      >
        Show More
      </button>
      }
      @if (showLessVisible) {
      <button
        (click)="showLess()"
        class="bg-red-500 text-white px-5 py-2 rounded-xl hover:bg-red-600 transition-all duration-300 transform hover:scale-105 shadow-md"
      >
        Show Less
      </button>
      }
    </div>
  </div>

  <!-- Modal -->
  <div
    *ngIf="showCreateUserModal"
    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50 z-50"
  >
    <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-md relative animate-fadeIn">
      <h2 class="text-xl font-bold text-indigo-700 mb-4">Create New User</h2>

      <form (ngSubmit)="createUser()" #createUserForm="ngForm" class="space-y-4">
        <input
          type="text"
          placeholder="Name"
          [(ngModel)]="newUser.name"
          name="name"
          required
          class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <input
          type="email"
          placeholder="Email"
          [(ngModel)]="newUser.email"
          name="email"
          required
          class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <input
          type="password"
          placeholder="Password"
          [(ngModel)]="newUser.password"
          name="password"
          required
          class="w-full px-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />

        <div class="flex justify-end gap-3">
          <button
            type="button"
            (click)="closeCreateUserModal()"
            class="px-4 py-2 rounded-xl border hover:bg-gray-100"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="px-4 py-2 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700"
          >
            Create
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
